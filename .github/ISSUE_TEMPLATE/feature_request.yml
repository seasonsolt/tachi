name: Feature request
description: Suggest an improvement or a new integration.
title: '[Feature] '
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed experience
      description: Describe what you would like Tachi to show or do.
    validations:
      required: true
  - type: input
    id: tool
    attributes:
      label: Related tool, if any
      placeholder: Claude Code, Codex, OpenCode, or another local agent
