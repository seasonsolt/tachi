name: Bug report
description: Report something that is broken in Tachi.
title: '[Bug] '
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve Tachi. Please remove private project names or transcript contents from screenshots and logs.
  - type: input
    id: version
    attributes:
      label: Tachi version
      placeholder: 1.3.0
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version and Mac model
      placeholder: macOS 15.5, MacBook Pro M3
    validations:
      required: true
  - type: dropdown
    id: tool
    attributes:
      label: Related coding tool
      options:
        - Claude Code
        - Codex
        - OpenCode
        - Claude Design
        - Pencil
        - Tachi itself
        - Other
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Include what you expected and what happened instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open Tachi
        2. Start a Codex session
        3. ...
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Screenshots or logs are welcome after removing private data.
